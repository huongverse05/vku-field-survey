<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <title>Phiếu điều tra</title>
</head>
<body>

<div class="container">
    <header class="header">
        <a href="index.html">← Trang chủ</a>
        <a href="result.html" style="float: right;">Xem danh sách phiếu →</a>
        <h1>Phiếu điều tra</h1>
        <p>Khảo sát cơ sở vật chất VKU</p>
    </header>

    <form id="surveyForm" class="card">
        <div class="form-group">
            <label for="investigator">Người điều tra</label>
            <input type="text" id="investigator" required placeholder="Nhập họ tên">
        </div>

        <div class="form-group">
            <label for="location">Địa điểm khảo sát</label>
            <input type="text" id="location" required placeholder="Ví dụ: Phòng A101">
        </div>

        <div class="form-group">
            <label for="facilityType">Loại cơ sở vật chất</label>
            <select id="facilityType" required>
                <option value="">-- Chọn --</option>
                <option value="Phòng học">Phòng học</option>
                <option value="Phòng máy">Phòng máy</option>
                <option value="Thư viện">Thư viện</option>
                <option value="Khuôn viên">Khuôn viên</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cơ sở vật chất có đảm bảo không?</label>
            <label class="radio">
                <input type="radio" name="quality" value="Có" required> Có
            </label>
            <label class="radio">
                <input type="radio" name="quality" value="Không"> Không
            </label>
        </div>

        <div class="form-group">
            <label for="rating">
                Mức độ đánh giá: <span id="ratingValue">3</span>/5
            </label>
            <input type="range" id="rating" min="1" max="5" value="3">
        </div>

        <div class="form-group">
            <label for="comment">Nhận xét</label>
            <textarea id="comment" rows="4" placeholder="Nhập nhận xét chi tiết..."></textarea>
        </div>

        <button type="submit" class="button" style="width: 100%;">Lưu phiếu</button>
        <div id="saveMessage" style="margin-top: 12px; font-weight: 500;"></div>
    </form>
</div>

<!-- Nạp script theo đúng thứ tự phụ thuộc -->
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/survey.js"></script>

<script>
// Cập nhật giá trị hiển thị của thanh kéo rating
const ratingRange = document.getElementById("rating");
const ratingText = document.getElementById("ratingValue");
if (ratingRange && ratingText) {
    ratingRange.addEventListener("input", (e) => {
        ratingText.textContent = e.target.value;
    });
}
</script>

</body>
</html>
