<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <title>Phiếu điều tra - VKU Field Survey</title>
</head>
<body>

<div class="container">
    <header class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <a href="index.html" style="text-decoration: none; color: #2563eb; font-weight: 500;">← Trang chủ</a>
            <a href="result.html" style="text-decoration: none; color: #2563eb; font-weight: 500;">Xem danh sách phiếu →</a>
        </div>
        <h1 style="margin: 0 0 4px 0;">Phiếu điều tra</h1>
        <p style="margin: 0 0 6px 0; color: #4b5563;">Khảo sát cơ sở vật chất VKU</p>
        <!-- Thẻ hiển thị trạng thái kết nối mạng được điều khiển bởi js/app.js -->
        <p id="networkStatus" style="margin: 0 0 16px 0; font-size: 14px; font-weight: 600;">Đang kiểm tra kết nối...</p>
    </header>

    <form id="surveyForm" class="card">
        <div class="form-group">
            <label for="investigator">Người điều tra</label>
            <input type="text" id="investigator" required placeholder="Nhập họ tên người khảo sát">
        </div>

        <div class="form-group">
            <label for="location">Địa điểm khảo sát</label>
            <input type="text" id="location" required placeholder="Ví dụ: Phòng K.A201, Tầng 2">
        </div>

        <div class="form-group">
            <label for="facilityType">Loại cơ sở vật chất</label>
            <select id="facilityType" required>
                <option value="">-- Chọn loại cơ sở --</option>
                <option value="Phòng học">Phòng học lý thuyết</option>
                <option value="Phòng máy">Phòng máy thực hành</option>
                <option value="Thư viện">Thư viện</option>
                <option value="Khuôn viên">Khuôn viên / Hành lang</option>
                <option value="Khu vệ sinh">Khu vệ sinh</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cơ sở vật chất có đảm bảo không?</label>
            <div style="display: flex; gap: 20px; margin-top: 6px;">
                <label class="radio" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="radio" name="quality" value="Có" required> Đạt chuẩn
                </label>
                <label class="radio" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="radio" name="quality" value="Không"> Không đạt
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="rating">
                Mức độ đánh giá: <span id="ratingValue" style="font-weight: bold; color: #2563eb;">3</span>/5 ⭐
            </label>
            <input type="range" id="rating" min="1" max="5" value="3" style="width: 100%;">
        </div>

        <div class="form-group">
            <label for="comment">Nhận xét chi tiết</label>
            <textarea id="comment" rows="4" placeholder="Mô tả cụ thể thực trạng thiết bị (máy chiếu, đèn, bàn ghế)..."></textarea>
        </div>

        <button type="submit" class="button" style="width: 100%; cursor: pointer;">Lưu phiếu khảo sát</button>
        <div id="saveMessage" style="margin-top: 12px; font-weight: 500; font-size: 14px;"></div>
    </form>
</div>

<!-- Nạp script theo đúng thứ tự phụ thuộc -->
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/survey.js"></script>

</body>
</html>
