<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <title>Phiếu đã lưu - VKU Field Survey</title>
</head>
<body>

<div class="container">
    <header class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <a href="survey.html" style="text-decoration: none; color: #2563eb; font-weight: 500;">← Tạo phiếu mới</a>
            <button id="btnManualSync" class="button" style="font-size: 13px; padding: 6px 12px; cursor: pointer;">
                🔄 Đồng bộ ngay
            </button>
        </div>
        <h1 style="margin: 0 0 6px 0;">Phiếu đã lưu</h1>
        <p id="networkStatusDisplay" style="margin: 0 0 16px 0; font-size: 14px;">Đang kiểm tra kết nối...</p>
    </header>

    <div id="surveyList">
        <div class="card">Đang đọc dữ liệu từ IndexedDB...</div>
    </div>
</div>

<!-- Nạp các module script theo đúng thứ tự phụ thuộc -->
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>

<script>
function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// Tải và hiển thị danh sách phiếu từ IndexedDB
async function loadSurveys() {
    const container = document.getElementById("surveyList");
    const statusDisplay = document.getElementById("networkStatusDisplay");
    
    if (statusDisplay) {
        statusDisplay.innerHTML = navigator.onLine 
            ? "Trạng thái: 🟢 <b>Online</b>" 
            : "Trạng thái: 🔴 <b>Offline</b> (Đang lưu cục bộ)";
    }

    try {
        if (typeof getAllSurveys !== "function") {
            throw new Error("Chưa nạp được hàm getAllSurveys() từ js/db.js");
        }

        const surveys = await getAllSurveys();

        if (!surveys || surveys.length === 0) {
            container.innerHTML = `
                <div class="card" style="text-align: center; padding: 24px;">
                    <h3 style="margin-top: 0;">Chưa có phiếu khảo sát</h3>
                    <p style="color: #6b7280;">Hiện chưa có dữ liệu nào lưu trên thiết bị.</p>
                    <a href="survey.html" class="button" style="display: inline-block; margin-top: 10px; text-decoration: none;">Tạo phiếu khảo sát mới</a>
                </div>
            `;
            return;
        }

        // Đảo ngược danh sách để hiển thị phiếu mới nhất lên đầu
        const reversedSurveys = [...surveys].reverse();

        container.innerHTML = reversedSurveys.map(survey => {
            const isSynced = survey.status === "synced" || survey.sync_status === "synced";
            const statusBadge = isSynced 
                ? `<span style="color: #16a34a; font-weight: bold; font-size: 13px;">🟢 Đã đồng bộ</span>` 
                : `<span style="color: #ea580c; font-weight: bold; font-size: 13px;">🟠 Chờ đồng bộ</span>`;

            const createdAt = survey.createdAt 
                ? new Date(survey.createdAt).toLocaleString("vi-VN") 
                : (survey.created_at ? new Date(survey.created_at).toLocaleString("vi-VN") : "Không rõ");

            return `
                <div class="card" style="margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; background: #fff;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <h3 style="margin: 0; color: #1f2937;">${escapeHTML(survey.location || "Không có địa điểm")}</h3>
                        <div>${statusBadge}</div>
                    </div>

                    <p style="margin: 4px 0;"><strong>Mã phiếu:</strong> <code style="font-size: 12px; background: #f3f4f6; padding: 2px 4px; border-radius: 4px;">${escapeHTML(survey.id)}</code></p>
                    <p style="margin: 4px 0;"><strong>Người điều tra:</strong> ${escapeHTML(survey.investigator || "Ẩn danh")}</p>
                    <p style="margin: 4px 0;"><strong>Loại cơ sở:</strong> ${escapeHTML(survey.facilityType || "Chung")}</p>
                    <p style="margin: 4px 0;"><strong>Đảm bảo:</strong> ${escapeHTML(survey.quality || "Không rõ")}</p>
                    <p style="margin: 4px 0;"><strong>Đánh giá:</strong> ⭐ ${survey.rating || 0}/5</p>
                    <p style="margin: 4px 0;"><strong>Nhận xét:</strong> ${escapeHTML(survey.comment || "Không có")}</p>
                    <p style="margin: 6px 0 0 0; font-size: 12px; color: #6b7280;"><strong>Thời gian:</strong> ${createdAt}</p>

                    <div style="margin-top: 12px; text-align: right;">
                        <button class="btn-delete button" data-id="${escapeHTML(survey.id)}" style="background: #dc2626; color: #fff; border: none; padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer;">
                            Xóa phiếu
                        </button>
                    </div>
                </div>
            `;
        }).join("");

    } catch (error) {
        console.error("Lỗi loadSurveys:", error);
        container.innerHTML = `
            <div class="card" style="padding: 16px; border: 1px solid #fecaca; background: #fef2f2; border-radius: 8px;">
                <h3 style="color: #dc2626; margin-top: 0;">❌ Lỗi đọc dữ liệu</h3>
                <p style="margin: 0;">Chi tiết: ${escapeHTML(error.message)}</p>
            </div>
        `;
    }
}

// Xử lý sự kiện click xóa thông qua Event Delegation
document.getElementById("surveyList").addEventListener("click", async (e) => {
    const deleteBtn = e.target.closest(".btn-delete");
    if (!deleteBtn) return;

    const id = deleteBtn.getAttribute("data-id");
    if (!confirm("Bạn có chắc chắn muốn xóa phiếu này khỏi bộ nhớ thiết bị?")) return;

    try {
        if (typeof deleteSurvey === "function") {
            await deleteSurvey(id);
            await loadSurveys();
        } else {
            alert("Thiếu hàm deleteSurvey() trong db.js");
        }
    } catch (err) {
        console.error("Lỗi xóa phiếu:", err);
        alert("Lỗi khi xóa: " + err.message);
    }
});

// Xử lý nút bấm đồng bộ thủ công
document.getElementById("btnManualSync").addEventListener("click", async () => {
    const btn = document.getElementById("btnManualSync");
    btn.disabled = true;
    btn.innerText = "Đang đồng bộ...";

    if (!navigator.onLine) {
        alert("Thiết bị đang Offline! Vui lòng kết nối mạng Internet để đồng bộ.");
        btn.disabled = false;
        btn.innerText = "🔄 Đồng bộ ngay";
        return;
    }

    try {
        if (typeof syncPendingSurveys === "function") {
            await syncPendingSurveys();
        } else {
            throw new Error("Không tìm thấy hàm syncPendingSurveys() từ js/sync.js");
        }
    } catch (err) {
        console.error("Lỗi khi kích hoạt đồng bộ:", err);
        alert("Lỗi: " + err.message);
    } finally {
        await loadSurveys();
        btn.disabled = false;
        btn.innerText = "🔄 Đồng bộ ngay";
    }
});

// Lắng nghe cập nhật khi trạng thái mạng thay đổi
window.addEventListener("online", async () => {
    if (typeof syncPendingSurveys === "function") {
        await syncPendingSurveys();
    }
    await loadSurveys();
});

window.addEventListener("offline", loadSurveys);

// Nạp dữ liệu ngay khi DOM sẵn sàng
document.addEventListener("DOMContentLoaded", loadSurveys);
</script>

</body>
</html>
